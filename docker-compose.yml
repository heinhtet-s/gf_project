services:
  postgres:
    image: postgres:16-alpine
    container_name: hireready-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecret
      POSTGRES_DB: hireready_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d hireready_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
